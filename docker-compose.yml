# ─────────────────────────────────────────────────────────────
# Identity stack — local dev
#
# Infrastructure:  postgres · rabbitmq · pgadmin (opcional)
# Identity APIs:   identity-issuer-service   :9001
#                  identity-verifier-service :9002
#                  identity-holder-service   :9005
#
# Usage:
#   docker compose up -d
#   docker compose up -d identity-issuer-service identity-holder-service
#   docker compose logs -f identity-holder-service
# ─────────────────────────────────────────────────────────────

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: identity
      RABBITMQ_DEFAULT_PASS: identity
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - identity
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_MULTIPLE_DATABASES: identity_holder,identity_issuer,identity_verifier
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    networks:
      - identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@identity.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - identity
    depends_on:
      postgres:
        condition: service_healthy

  # Build context: repo root — Dockerfiles in */source copy packages/identity-core.

  identity-issuer-service:
    build:
      context: .
      dockerfile: identity-issuer-service/source/Dockerfile
    restart: unless-stopped
    env_file: identity-issuer-service/source/.env
    environment:
      PORT: 9001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: identity
      DB_PASSWORD: identity
      DB_DATABASE: identity_issuer
      DATABASE_URL: postgresql://identity:identity@postgres:5432/identity_issuer
      ASKAR_STORE_ID: identity_issuer
      ASKAR_STORE_KEY: identity-dev-askar-store-key
      NODE_ENV: development
      RABBITMQ_URL: amqp://identity:identity@rabbitmq:5672
    ports:
      - "9001:9001"
    networks:
      - identity
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-verifier-service:
    build:
      context: .
      dockerfile: identity-verifier-service/source/Dockerfile
    restart: unless-stopped
    env_file: identity-verifier-service/source/.env
    environment:
      PORT: 9002
      DATABASE_URL: postgresql://identity:identity@postgres:5432/identity_verifier
      ASKAR_STORE_ID: identity_verifier
      ASKAR_STORE_KEY: identity-dev-askar-store-key
      NODE_ENV: development
      RABBITMQ_URL: amqp://identity:identity@rabbitmq:5672
    ports:
      - "9002:9002"
    networks:
      - identity
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-holder-service:
    build:
      context: .
      dockerfile: identity-holder-service/source/Dockerfile
    restart: unless-stopped
    env_file: identity-holder-service/source/.env
    environment:
      PORT: 9005
      DATABASE_URL: postgresql://identity:identity@postgres:5432/identity_holder
      ASKAR_STORE_ID: identity_holder
      ASKAR_STORE_KEY: identity-dev-askar-store-key
      NODE_ENV: development
      RABBITMQ_URL: amqp://identity:identity@rabbitmq:5672
    ports:
      - "9005:9005"
    networks:
      - identity
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  rabbitmq_data:

networks:
  identity:
    driver: bridge
